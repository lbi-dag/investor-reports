name: Sync Amplifon reports

on:
  schedule:
    - cron: "17 8 10,25 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install extraction dependencies
        run: npm ci

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Sync official Amplifon reports
        run: python3 scripts/sync_amplifon_reports.py

      - name: Create source update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-amplifon-reports
          delete-branch: true
          commit-message: "Update Amplifon source reports"
          title: "Update Amplifon source reports"
          body: |
            Automated twice-monthly sync of Amplifon's official financial reports
            and results presentations.
