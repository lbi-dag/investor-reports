name: Sync Sonova reports
on:
  schedule:
    - cron: "27 9 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python3 scripts/sync_sonova_reports.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-sonova-reports
          delete-branch: true
          commit-message: "Update Sonova source reports"
          title: "Update Sonova source reports"
