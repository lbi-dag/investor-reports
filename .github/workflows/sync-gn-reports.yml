name: Sync GN reports

on:
  schedule:
    - cron: "47 8 10,25 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Discover and sync official GN reports
        run: python3 scripts/sync_gn_reports.py

      - name: Create source update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-gn-reports
          delete-branch: true
          commit-message: "Update GN source reports"
          title: "Update GN source reports"
          body: |
            Automated twice-monthly discovery and sync of official GN
            financial reports and conference-call presentations.
